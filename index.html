<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rakshitha Kalkura | Academic Portfolio</title>
  <meta name="description" content="Rakshitha Kalkura — MS (CS) student at IIT Madras working on robustness and efficiency of Spiking Neural Networks.">
  <link rel="stylesheet" href="style.css?v=5">
  <noscript><meta http-equiv="refresh" content="0; url=portfolio.html"></noscript>
</head>
<body>
  <nav class="menubar">
    <span class="brand">raksh@raksh <span class="d">~</span></span>
    <div class="menu">
      <a href="./" class="active" aria-current="page">Terminal</a>
      <a href="portfolio.html">Simple view</a>
      <button type="button" id="help-btn">Help</button>
    </div>
  </nav>

  <!-- Draggable ASCII cats live here -->
  <div id="cat-layer" aria-hidden="true"></div>

  <main class="window" id="window">
    <div class="titlebar">
      <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
      <span class="title">raksh@raksh: ~ — zsh</span>
    </div>
    <div class="terminal" id="terminal">
      <div id="output" aria-live="polite"></div>
      <div class="input-line" id="input-line">
        <span class="prompt" id="prompt"></span>
        <input id="cmd" type="text" autocomplete="off" autocapitalize="off"
               autocorrect="off" spellcheck="false" aria-label="Terminal command">
      </div>
    </div>
  </main>

  <script src="script.js?v=5"></script>
</body>
</html>
